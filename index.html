<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فلش‌کارت</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#14213d">
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#14213d;--mute:#6b7280;--line:#e2ddd3;--acc:#0f766e;
--again:#b42318;--hard:#b45309;--good:#15803d;--easy:#1d4ed8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1626;--card:#18223a;--ink:#eef1f7;--mute:#9aa4b8;--line:#2a3652;--acc:#2dd4bf;
--again:#f87171;--hard:#fbbf24;--good:#4ade80;--easy:#60a5fa;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:12px 14px 90px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:12px 4px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected=true]{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
section[hidden]{display:none}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:4px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;min-height:240px}
.word{font-size:34px;font-weight:700;text-align:center;margin:30px 0;direction:auto;word-break:break-word}
.en{direction:ltr;unicode-bidi:isolate}
.big{font-size:26px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pron{color:var(--mute);margin:2px 0 10px}
.pron .en{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.ex{border-inline-start:3px solid var(--acc);padding:2px 10px;margin:10px 0}
.ex .en{font-weight:600}
.ex div:last-child{color:var(--mute);font-size:15px}
.note{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:12px}
.tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (prefers-color-scheme:dark){.btn.pri{color:#06201c}}
.show{width:100%;margin-top:14px;padding:14px;font-size:16px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate button{padding:10px 2px;font-size:14px;font-weight:700;border-width:2px}
.rate small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.rate .a{border-color:var(--again);color:var(--again)}.rate .h{border-color:var(--hard);color:var(--hard)}
.rate .g{border-color:var(--good);color:var(--good)}.rate .e{border-color:var(--easy);color:var(--easy)}
textarea,input[type=text],input[type=password],input[type=search]{width:100%;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px}
textarea{min-height:140px;direction:auto}
label{display:block;margin:14px 0 6px;font-weight:700}
.list .it{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.list .it b{flex:1;direction:auto;text-align:start}
.list .it span{color:var(--mute);font-size:12px}
.x{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
#msg{position:fixed;top:10px;inset-inline:14px;max-width:530px;margin:auto;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:9;display:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-inline-end:6px}
.dot.on{background:var(--good)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="msg" role="status"></div>
<main>
<section id="study"></section>
<section id="add" hidden>
  <label for="words">کلمه‌ها (هر خط یک کلمه، فارسی یا انگلیسی)</label>
  <textarea id="words" placeholder="serendipity&#10;شانس&#10;give up"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn pri" id="addBtn">ساخت کارت</button></div>
  <label for="file">ورودی از فایل (Excel ،CSV ،apkg)</label>
  <input type="file" id="file" accept=".xlsx,.xls,.csv,.apkg">
  <p class="pron" style="font-size:13px">اکسل: ستون اول هر شیت اول، کلمه‌هاست. apkg: فیلد اول هر نوت. کارت‌های ساخته‌شده فقط کلمه را نگه می‌دارند و ترجمه و مثال را هوش مصنوعی می‌سازد.</p>
  <div id="queue" class="pron"></div>
</section>
<section id="cards" hidden>
  <input type="search" id="q" placeholder="جستجو">
  <div id="list" class="list"></div>
</section>
<section id="set" hidden>
  <label for="key">کلید دسترسی (همان APP_KEY که روی ورکر ست کردی)</label>
  <input type="password" id="key" autocomplete="off">
  <div class="row" style="margin-top:10px">
    <button class="btn pri" id="saveKey">ذخیره و همگام‌سازی</button>
    <button class="btn" id="syncNow">همگام‌سازی الان</button>
  </div>
  <p class="pron"><span class="dot" id="dot"></span><span id="syncState">—</span></p>
</section>
</main>
<nav role="tablist">
  <button role="tab" data-t="study" aria-selected="true">مرور</button>
  <button role="tab" data-t="add" aria-selected="false">افزودن</button>
  <button role="tab" data-t="cards" aria-selected="false">کارت‌ها</button>
  <button role="tab" data-t="set" aria-selected="false">تنظیمات</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MIN=6e4,DAY=864e5;
const STEPS={again:30*MIN,hard:DAY,good:3*DAY,easy:365*DAY};
const LBL={again:'۳۰ دقیقه',hard:'۱ روز',good:'۳ روز',easy:'۱ سال'};
const LIB={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
 zip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
 sql:'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js',
 sqlBase:'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'};

/* ---------- storage ---------- */
let db,cards=[];
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('flash',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('cards',{keyPath:'id'});
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const store=m=>db.transaction('cards',m).objectStore('cards');
const getAll=()=>new Promise(r=>{const q=store('readonly').getAll();q.onsuccess=()=>r(q.result)});
const putMany=cs=>new Promise(r=>{const t=db.transaction('cards','readwrite'),s=t.objectStore('cards');cs.forEach(c=>s.put(c));t.oncomplete=()=>r()});
const save=async c=>{c.updatedAt=Date.now();await putMany([c]);scheduleSync()};
async function refresh(){cards=(await getAll()).filter(c=>!c.deleted);render()}

const toast=(t,ms=2500)=>{const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',ms)};
const isFa=s=>/[\u0600-\u06FF]/.test(s);
const speak=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch{}};
const fmtDue=ms=>{const d=ms-Date.now();if(d<=0)return'الان';if(d<36e5)return Math.ceil(d/MIN)+' دقیقه دیگر';if(d<DAY)return Math.ceil(d/36e5)+' ساعت دیگر';return Math.ceil(d/DAY)+' روز دیگر'};

/* ---------- study ---------- */
let cur=null,shown=false;
const dueList=()=>{const n=Date.now();return cards.filter(c=>c.status==='ready'&&c.due<=n).sort((a,b)=>a.due-b.due)};
function backHtml(c){const d=c.data;
 return `<div class="row"><span class="big en">${esc(d.en)}</span>
 <button class="btn" data-say="${esc(d.en)}" aria-label="پخش تلفظ">🔊</button>${d.pos?`<span class="tag">${esc(d.pos)}</span>`:''}</div>
 <div class="pron"><span class="en">${esc(d.ipa)}</span> &nbsp; ${esc(d.fa_pron)}</div>
 <div class="big" style="font-size:22px">${esc(d.fa)}</div>
 ${(d.examples||[]).map(e=>`<div class="ex"><div class="en">${esc(e.en)}</div><div>${esc(e.fa)}</div></div>`).join('')}
 ${d.note?`<div class="note">${esc(d.note)}</div>`:''}`}
function renderStudy(){
 const list=dueList(),el=$('#study');
 if(!cards.length){el.innerHTML='<div class="empty">هنوز کارتی نداری.<br>از تب «افزودن» چند کلمه بده.</div>';cur=null;return}
 if(!list.length){const next=cards.filter(c=>c.status==='ready').sort((a,b)=>a.due-b.due)[0];
  const pend=cards.filter(c=>c.status!=='ready').length;
  el.innerHTML=`<div class="empty">برای الان کارتی نمونده 🎉<br>${next?'کارت بعدی: '+fmtDue(next.due):''}${pend?`<br>${pend} کارت در انتظار ساخت است`:''}</div>`;cur=null;return}
 if(!cur||!list.includes(cur)&&!shown)cur=list[0];
 else if(!list.find(c=>c.id===cur.id))cur=list[0];
 const c=cur;
 el.innerHTML=`<div class="top"><span>${list.length} کارت آماده مرور</span><span>${cards.length} کل</span></div>
 <div class="card">${shown?backHtml(c):`<div class="word">${esc(c.word)}</div>`}</div>
 ${shown?`<div class="rate">${['again','hard','good','easy'].map((k,i)=>`<button class="btn ${k[0]}" data-r="${k}">${{again:'دوباره',hard:'سخت',good:'خوب',easy:'آسون'}[k]}<small>${LBL[k]}</small></button>`).join('')}</div>`
 :'<button class="btn pri show" id="showBtn">نمایش جواب</button>'}`;
 if(!shown&&!isFa(c.word)){} 
}
async function rate(k){if(!cur||!shown)return;const c=cur;c.due=Date.now()+STEPS[k];c.interval=STEPS[k];c.reps=(c.reps||0)+1;
 shown=false;cur=null;await save(c);await refresh()}
$('#study').addEventListener('click',e=>{
 const s=e.target.closest('[data-say]');if(s)return speak(s.dataset.say);
 const r=e.target.closest('[data-r]');if(r)return rate(r.dataset.r);
 if(e.target.id==='showBtn'){shown=true;renderStudy()}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;
 if($('#study').hidden)return;
 if(e.key===' '&&cur&&!shown){e.preventDefault();shown=true;renderStudy()}
 else if(shown&&'1234'.includes(e.key))rate(['again','hard','good','easy'][+e.key-1])});

/* ---------- list ---------- */
function renderList(){const q=$('#q').value.trim().toLowerCase();
 const l=cards.filter(c=>!q||c.word.toLowerCase().includes(q)||(c.data?.fa||'').includes(q)||(c.data?.en||'').toLowerCase().includes(q))
  .sort((a,b)=>b.createdAt-a.createdAt).slice(0,300);
 $('#list').innerHTML=l.length?l.map(c=>`<div class="it"><b>${esc(c.word)}</b><span>${c.status==='ready'?fmtDue(c.due):c.status==='error'?'خطا':'در انتظار'}</span>
 ${c.status==='error'?`<button class="x" data-retry="${esc(c.id)}" title="تلاش دوباره">↻</button>`:''}<button class="x" data-del="${esc(c.id)}" aria-label="حذف">✕</button></div>`).join(''):'<div class="empty">چیزی پیدا نشد</div>'}
$('#q').oninput=renderList;
$('#list').addEventListener('click',async e=>{
 const d=e.target.closest('[data-del]'),r=e.target.closest('[data-retry]');
 if(d){const c=cards.find(x=>x.id===d.dataset.del);c.deleted=true;await save(c);await refresh()}
 if(r){const c=cards.find(x=>x.id===r.dataset.retry);c.status='pending';await save(c);await refresh();gen()}});

/* ---------- add / import ---------- */
async function addWords(ws){
 const have=new Set((await getAll()).map(c=>c.id));let n=0;const now=Date.now(),out=[];
 for(let w of ws){w=String(w).replace(/\s+/g,' ').trim();if(!w||w.length>60)continue;
  const id=w.toLowerCase();if(have.has(id))continue;have.add(id);
  out.push({id,word:w,status:'pending',due:now,interval:0,reps:0,createdAt:now,updatedAt:now});n++}
 await putMany(out);await refresh();toast(n+' کارت جدید اضافه شد');gen();scheduleSync()}
$('#addBtn').onclick=()=>{const v=$('#words').value.split('\n');$('#words').value='';addWords(v)};
const load=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();
 const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('بارگذاری کتابخانه ناموفق بود (آنلاین نیستی؟)'));document.head.appendChild(s)});
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{toast('در حال خواندن فایل…',8000);const ext=f.name.split('.').pop().toLowerCase();let ws=[];
  if(['xlsx','xls','csv'].includes(ext)){await load(LIB.xlsx);
   const wb=XLSX.read(await f.arrayBuffer());
   ws=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}).map(r=>r[0]).filter(v=>v!=null&&v!=='').map(String);
   if(/^(word|words|front|کلمه|واژه)$/i.test((ws[0]||'').trim()))ws.shift()}
  else if(ext==='apkg'){await load(LIB.zip);await load(LIB.sql);
   const z=await JSZip.loadAsync(f);const ent=z.file('collection.anki21')||z.file('collection.anki2');
   if(!ent||(z.file('collection.anki21b')&&!z.file('collection.anki21')))
    throw new Error('این apkg با فرمت جدید است. موقع Export از Anki گزینه Support older Anki versions را بزن.');
   const SQL=await initSqlJs({locateFile:n=>LIB.sqlBase+n});
   const d=new SQL.Database(await ent.async('uint8array'));
   ws=((d.exec('select flds from notes')[0]||{}).values||[]).map(v=>String(v[0]).split('\x1f')[0].replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').trim());d.close()}
  else throw new Error('فرمت فایل پشتیبانی نمی‌شود');
  if(!ws.length)throw new Error('کلمه‌ای در فایل پیدا نشد');
  await addWords(ws)}catch(err){toast(err.message,6000)}};

/* ---------- AI generation (queued, offline-safe) ---------- */
const KEY=()=>localStorage.getItem('appKey')||'';
let genBusy=false;
async function gen(){
 if(genBusy||!navigator.onLine||!KEY())return;genBusy=true;
 try{
  while(true){
   const todo=cards.filter(c=>c.status==='pending').slice(0,3);if(!todo.length)break;
   $('#queue').textContent=`در حال ساخت… ${cards.filter(c=>c.status==='pending').length} کارت مانده`;
   let stop=false;
   await Promise.all(todo.map(async c=>{
    try{const r=await fetch('/api/generate',{method:'POST',headers:{'content-type':'application/json','x-app-key':KEY()},body:JSON.stringify({word:c.word})});
     if(r.status===401){stop=true;toast('کلید دسترسی اشتباه است');return}
     const j=await r.json();if(!r.ok)throw 0;c.data=j.data;c.status='ready';c.due=Date.now()}
    catch{if(!stop){c.status='error'}}
    await save(c)}));
   await refresh();if(stop||!navigator.onLine)break}
 }finally{genBusy=false;$('#queue').textContent=cards.some(c=>c.status==='pending')&&!KEY()?'برای ساخت کارت، کلید دسترسی را در تنظیمات وارد کن.':''}
}

/* ---------- sync ---------- */
let syncT,syncing=false;
const scheduleSync=()=>{clearTimeout(syncT);syncT=setTimeout(sync,2500)};
function syncState(t,on){$('#syncState').textContent=t;$('#dot').className='dot'+(on?' on':'')}
async function sync(manual){
 if(syncing||!KEY())return;if(!navigator.onLine){syncState('آفلاین — بعداً همگام می‌شود');return}
 syncing=true;
 try{const since=+localStorage.since||0,lastPush=+localStorage.lastPush||0,t0=Date.now();
  const all=await getAll();
  const r=await fetch('/api/sync',{method:'POST',headers:{'content-type':'application/json','x-app-key':KEY()},
   body:JSON.stringify({cards:all.filter(c=>c.updatedAt>lastPush),since})});
  if(r.status===401){syncState('کلید اشتباه است');return}
  const j=await r.json();const local=new Map(all.map(c=>[c.id,c]));
  await putMany(j.cards.filter(c=>!local.has(c.id)||c.updatedAt>local.get(c.id).updatedAt));
  localStorage.since=j.now;localStorage.lastPush=t0;
  await refresh();syncState('همگام شد · '+new Date().toLocaleTimeString('fa-IR'),true);gen()
 }catch{syncState('همگام‌سازی ناموفق بود')}finally{syncing=false}}
$('#saveKey').onclick=()=>{localStorage.appKey=$('#key').value.trim();localStorage.since=0;localStorage.lastPush=0;sync(true);gen()};
$('#syncNow').onclick=()=>sync(true);
addEventListener('online',()=>{sync();gen()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});

/* ---------- tabs / boot ---------- */
function render(){renderStudy();if(!$('#cards').hidden)renderList()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
 document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!==b.dataset.t);
 if(b.dataset.t==='cards')renderList();if(b.dataset.t==='study')renderStudy()});
(async()=>{await open();$('#key').value=KEY();await refresh();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
 if(!KEY())document.querySelector('[data-t=set]').click();else{sync();gen()}
 setInterval(()=>{if(!shown)renderStudy()},60000)})();
</script>
</body>
</html>
