:root{--nb:max(6px,calc(env(safe-area-inset-bottom) - 16px));--bg:#000;--surf:#1c1c1e;--surf2:#2c2c2e;--ink:#fff;--mute:#8e8e93;--line:#2f2f31;--acc:#0a84ff;--onacc:#fff;
--again:#ff453a;--hard:#ff9f0a;--good:#30d158;--easy:#0a84ff;color-scheme:dark}
:root[data-theme=light]{--bg:#f2f2f7;--surf:#fff;--surf2:#e9e9ee;--ink:#000;--mute:#6c6c70;--line:#d8d8dc;--acc:#007aff;
--again:#ff3b30;--hard:#e08600;--good:#1fa84a;--easy:#007aff;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:BNazanin,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Tahoma,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 120px}
section[hidden]{display:none}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px}
.rb .i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#syncBtn.busy .i{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.rb{width:46px;height:46px;border-radius:50%;border:0;background:var(--surf);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:22px;flex:none}
h1{font-size:19px;font-weight:700;margin:0;text-align:center;flex:1;unicode-bidi:plaintext;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* floating tab bar */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--nb);width:min(420px,calc(100% - 28px));
 display:flex;gap:2px;padding:6px;background:var(--surf);border:1px solid var(--line);border-radius:999px;z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--ink);padding:7px 0 6px;border-radius:999px;font:inherit;font-size:11px;font-weight:600;cursor:pointer}
nav button[aria-selected=true]{background:var(--bg);color:var(--acc)}

/* study */
.seen{padding:2px 10px;border-radius:999px;background:var(--surf);font-size:12px;font-weight:600;white-space:nowrap}.seen.new{background:var(--acc);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px;margin:0 4px 10px}
.card{background:var(--surf);border-radius:26px;padding:24px 20px;min-height:260px}
.word{white-space:pre-line;font-size:calc(36px*var(--ff,1)*var(--fz,1));font-weight:700;text-align:center;margin:56px 0;word-break:break-word}
.en{direction:ltr;unicode-bidi:isolate}
.big{font-size:26px;font-weight:700}
.card.bk{font-size:calc(16px*var(--fb,1))}
.bk .big{font-size:1.625em}.bk .big.fa{font-size:1.375em}.bk .fld div{font-size:calc(1.1875em*var(--fz,1))}.bk .fld small{font-size:.75em}
.bk .ex .tr{font-size:.9375em}.bk .pron .en{font-size:.875em}.bk .note{font-size:.875em}.bk .tag{font-size:.75em}
.szr{display:flex;align-items:center;gap:12px}.szr input{flex:1}.szr b{min-width:46px;text-align:end;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pron{color:var(--mute);margin:2px 0 10px}
.pron .en{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.ex{border-inline-start:3px solid var(--acc);padding:2px 12px;margin:12px 0}
.ex .en{font-weight:600}
.ex .tr{color:var(--mute);font-size:15px}
.note{background:var(--surf2);border-radius:14px;padding:10px 14px;font-size:14px;margin-top:12px}
.fld{margin:12px 0}/* per-field text style (size / colour) chosen in Front / back fields */
.word.fw{margin:6px 0}.fseg{margin:34px 0}.fseg+hr.fl{margin:0}
.lysty{grid-column:2/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.lysty button{border:0;border-radius:10px;background:var(--surf2);color:var(--ink);font:inherit;font-size:13px;min-width:36px;padding:5px 8px;cursor:pointer}
.lysty b{min-width:44px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.lysty input[type=color]{width:34px;height:30px;padding:0;border:0;border-radius:8px;background:none;cursor:pointer}.lysty input.un{opacity:.35}
hr.fl{border:0;border-top:1px solid var(--line);margin:14px 0}.word.seg{margin:22px 0}.fld small{display:block;color:var(--mute);font-size:12px}.fld div{font-size:calc(19px*var(--fz,1));white-space:pre-line;word-break:break-word}
.tag{font-size:12px;color:var(--mute);background:var(--surf2);border-radius:999px;padding:1px 9px;font-weight:500}
.btn{font:inherit;border:0;background:var(--surf);color:var(--ink);border-radius:999px;padding:11px 18px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--acc);color:var(--onacc)}
.btn.sm{padding:6px 14px;font-size:14px;background:var(--surf)}
.btn.sm.on,.btn.on{background:var(--acc);color:var(--onacc)}
.danger{color:var(--again)}
.show{width:100%;margin-top:14px;height:54px;font-size:17px}
.studying nav{display:none}
.studying main{padding-bottom:150px}
#sdock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));z-index:6;display:none;padding:10px;background:var(--surf2);border-radius:28px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#sdock.on{display:block}
#sdock .show,#sdock .rate{margin-top:0}
.deck small{color:var(--mute);font-size:14px}
.deck span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck .dn,.dkh .dn{flex:none;width:50px;text-align:center;font-variant-numeric:tabular-nums}
.deck .dn{font-size:16px}.deck .dn.z{opacity:.45}.deck .dn.d{color:var(--acc);font-weight:700}
.srow.deck{gap:0}.deck span{margin-inline-end:8px}
.deck .chev,.dkh .cv{flex:none;width:20px;padding:0;text-align:center}
.dkh{display:flex;align-items:center;padding:0 16px 6px;color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.dkh .nm{flex:1}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.rate button{border:0;background:var(--surf);border-radius:20px;padding:12px 2px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.rate small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.rate .s{background:#48484a;color:#fff}.rate .s small{color:#c7c7cc}
:root[data-theme=light] .rate .s{background:#c7c7cc;color:#3a3a3c}:root[data-theme=light] .rate .s small{color:#636366}
.rate .a{color:var(--again)}.rate .h{color:var(--hard)}.rate .g{color:var(--good)}.rate .e{color:var(--easy)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{font:inherit;font-size:14px;font-weight:600;border:0;background:var(--surf);color:var(--mute);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:var(--onacc)}

/* settings sections + switch */
.sgrp{background:var(--surf);border-radius:20px;overflow:hidden}
.srow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:17px;padding:15px 16px;text-align:start;cursor:pointer}
.srow+.srow{border-top:1px solid var(--line)}.srow[hidden]{display:none}
input.secret{-webkit-text-security:disc;text-security:disc} /* looks like a password field, but is not one, so browsers do not offer to save it */
.urow{display:flex;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}.urow .nm{flex:1;min-width:0}.urow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.urow .nm small{color:var(--mute)}.newkey{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--surf);word-break:break-all}.newkey code{display:block;margin:8px 0;font-size:15px;user-select:all;direction:ltr}
.srow svg.i{color:var(--acc);flex:none}
.srow span{flex:1}
.spg[hidden],#setHome[hidden]{display:none}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surf2);border-radius:16px;padding:12px 16px;margin-top:14px;font-size:15px;font-weight:600}
.tg small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:999px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.sw:checked{background:var(--good)}.sw:checked::after{transform:translateX(20px)}

/* forms */
select,textarea,input[type=text],input[type=password],input[type=number]{width:100%;font:inherit;font-size:16px;background:var(--surf);color:var(--ink);border:0;border-radius:16px;padding:13px 16px}
textarea{min-height:150px;resize:vertical}
label,.fl{display:block;margin:18px 4px 6px;font-size:13px;font-weight:600;color:var(--mute)}
.search{display:flex;align-items:center;gap:10px;background:var(--surf);border-radius:999px;padding:0 18px;height:50px;margin-bottom:6px;color:var(--mute)}
.search input{border:0;background:none;padding:0;height:100%;font-size:17px;color:var(--ink);flex:1;outline:0;min-width:0}
input[type=file]{width:100%;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--acc)}

/* lists */
.it{display:flex;align-items:center;gap:14px;padding-inline-start:4px;cursor:pointer}
.ic{width:40px;height:52px;flex:none;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--mute);background:var(--surf);font-size:15px}
.ic.f{border:0;background:none;color:var(--acc)}
.ic.f svg{width:42px;height:42px;fill:currentColor;stroke:none}
.bd{flex:1;min-width:0;min-height:70px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.it:last-child .bd{border-bottom:0}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:500;font-size:17px;unicode-bidi:plaintext;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--mute);font-size:13px}
.chev{color:var(--mute);font-size:20px;padding:0 6px}
.x{border:0;background:none;color:var(--mute);font-size:19px;cursor:pointer;padding:6px}
.count{text-align:center;font-weight:700;font-size:15px;margin:22px 0}
.empty{text-align:center;color:var(--mute);padding:60px 10px}
.catline{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:var(--surf);color:var(--ink);display:grid;place-items:center;position:relative;cursor:pointer;padding:0;flex:none}
.ib svg.i{width:20px;height:20px}
.ib.on{background:var(--acc);color:var(--onacc)}
.ib.danger{color:var(--again)}
.ib:disabled{opacity:.4}
.ib .bg{position:absolute;top:-3px;inset-inline-end:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--onacc);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}
#selbar .ib{background:var(--surf)}
.act.danger{color:var(--again)}
#chips select{font-weight:600}

#msg{position:fixed;top:max(10px,env(safe-area-inset-top));inset-inline:14px;max-width:530px;margin:auto;background:var(--surf2);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;display:none;text-align:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-inline-end:6px}
.dot.on{background:var(--good)}
dialog{border:0;background:var(--surf);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog.pop{position:fixed;inset:auto;top:var(--pt,60px);right:var(--pr,16px);left:auto;margin:0;width:min(229px,calc(100% - 32px));max-height:calc(100vh - var(--pt,60px) - 20px);padding:10px 0;border-radius:32px;background:linear-gradient(#262627,#202020 35%);--psep:#323232;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 8px 30px rgba(0,0,0,.45);overflow-y:auto}
:root[data-theme=light] dialog.pop{background:linear-gradient(#f9f9fb,#f2f2f4 35%);--psep:#d9d9dc;box-shadow:0 8px 30px rgba(0,0,0,.18)}
dialog.pop::backdrop{background:transparent}
.pop .act{background:none;border-radius:0;margin:0;padding:8px 24px 8px 20px;font-size:14px;font-weight:400;gap:11px;line-height:20px}
dialog.pop:focus-visible,.pop .act:focus,.pop .act:focus-visible{outline:0}
.pop .act svg.i{width:20px;height:20px;stroke-width:1.6;flex:none}
.pop .act.sep{margin-top:21px;padding-top:8px;border-top:0;position:relative}
.pop .act.sep::before{content:"";position:absolute;top:-11px;left:20px;right:20px;height:1px;background:var(--psep)}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:0;background:var(--surf2);color:var(--ink);font:inherit;font-size:17px;padding:15px 18px;border-radius:16px;margin-top:8px;cursor:pointer}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);flex:none;display:grid;place-items:center}
.ck.on{background:var(--acc);border-color:var(--acc)}
.ck.on::after{content:"✓";color:var(--onacc);font-size:15px;font-weight:700}
#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nb) + 74px);width:min(420px,calc(100% - 28px));display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px;background:var(--surf2);border-radius:26px;z-index:6;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#selbar .n{width:100%;text-align:center;font-size:13px;color:var(--mute)}
#selbar .btn.sm{background:var(--surf)}
#selbar button:disabled{opacity:.4}
.iv{display:flex;align-items:center;gap:8px;margin-top:8px}
.iv span{width:64px;font-weight:700}
.iv input{width:96px}.iv select{flex:1}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* import row, pins, category reordering */
#impBox{margin-top:22px}
#impBox.drag{outline:2px dashed var(--acc);outline-offset:3px}
svg.i.pn{width:15px;height:15px;stroke-width:2.2;margin-inline-start:7px;vertical-align:-2px;color:var(--acc);flex:none}
.cedit{display:flex;align-items:center;flex:none}
.cedit .x{padding:6px 7px;line-height:1;display:grid;place-items:center}
.cedit .x svg.i{width:20px;height:20px}
.cedit .x.on{color:var(--acc)}
[data-grip]{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--mute);display:grid;place-items:center;padding:6px 8px;flex:none}
[data-grip] svg.i{width:20px;height:20px}
.dragging{position:relative;z-index:20;background:var(--surf2);border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.4);cursor:grabbing;opacity:.97}
.dragging [data-grip]{cursor:grabbing}
.ib.stopg{color:var(--again)}
.cedit .x:disabled{opacity:.25;cursor:default}
</style>
</head>

    <div class="row" style="margin-top:12px">

        <div class="pron"><span class="en">/rʌn/</span></div><div class="big fa" dir="auto">دویدن</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MIN=6e4,DAY=864e5;
const DEF={again:30*MIN,hard:DAY,good:3*DAY,easy:365*DAY};
const steps=()=>{try{return{...DEF,...JSON.parse(localStorage.steps||'{}')}}catch{return{...DEF}}};
const fmtIv=ms=>{const m=ms/MIN;if(m<60)return Math.round(m)+' min';if(m<1440){const h=Math.round(m/60);return h+' h'}
 const d=ms/DAY;if(d<60){const n=Math.round(d);return n+(n===1?' day':' days')}if(d<360)return Math.round(d/30)+' mo';
 const y=Math.round(d/365*10)/10;return y+(y===1?' year':' years')};
const NAME={again:'Again',hard:'Hard',good:'Good',easy:'Easy'};
const LIB={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
 fsrs:'https://cdn.jsdelivr.net/npm/ts-fsrs@4/dist/index.umd.js',
 zip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
 sql:'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js',
 sqlBase:'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'};
const ICONS={
 select:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
 selall:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l3 3 5-6"/>',
 desel:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12h8"/>',
 done:'<path d="M5 12.5l4.5 4.5L19 7"/>',
 rename:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
 reset:'<path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/>',
 gen:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15v4M17 17h4"/>',
 del:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
 move:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 13h6M13 10l3 3-3 3"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 sync:'<path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/>',
 sort:'<path d="M4 7h9M4 12h6M4 17h3M17 5v14M14 16l3 3 3-3"/>',
 flip:'<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
 layout:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/>',
 theme:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
 star:'<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17l-5.3 2.7 1.1-5.9L3.5 9.7l5.9-.8z"/>',
 note:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
 pin:'<path d="M9 4h6l-1 5.5 3 3V15H7v-2.5l3-3z"/><path d="M12 15v5"/>',
 stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',
 grip:'<g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></g>',
 export:'<path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>'};
const ico=k=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]||''}</svg>`;
const ib=(attr,k,label,cls='',badge)=>`<button class="ib ${cls}" ${attr} title="${label}" aria-label="${label}">${ico(k)}${badge?`<span class="bg">${badge}</span>`:''}</button>`;
const FOLDER='<svg viewBox="0 0 24 24"><path d="M2 7a3 3 0 0 1 3-3h4l2 2h8a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3z"/></svg>';

const PINI='<svg class="i pn" viewBox="0 0 24 24" aria-hidden="true">'+ICONS.pin+'</svg>';

/* ---------- storage ---------- */
let db,cards=[];
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('flash',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('cards',{keyPath:'id'});
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const store=m=>db.transaction('cards',m).objectStore('cards');
const getAll=()=>new Promise(r=>{const q=store('readonly').getAll();q.onsuccess=()=>r(q.result)});
const getMany=ids=>new Promise(r=>{const t=db.transaction('cards'),st=t.objectStore('cards'),o=[];ids.forEach((id,i)=>{st.get(id).onsuccess=e=>{o[i]=e.target.result}});t.oncomplete=()=>r(o)});
const putMany=cs=>new Promise(r=>{const t=db.transaction('cards','readwrite'),s=t.objectStore('cards');cs.forEach(c=>s.put(c));t.oncomplete=()=>r()});
const save=async c=>{c.updatedAt=Date.now();await putMany([c]);scheduleSync()};
async function refresh(){cards=(await getAll()).filter(c=>!c.deleted);render()}

const toast=(t,ms=2500)=>{const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',ms)};
const rateVal=()=>+localStorage.rate||0.7;
let enVoice=null;const pickVoice=()=>{try{const v=speechSynthesis.getVoices().filter(x=>/^en[-_]US/i.test(x.lang));enVoice=v.find(x=>x.localService)||v[0]||null}catch{}};
try{pickVoice();speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch{}
const speak=t=>{try{const go=()=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(enVoice)u.voice=enVoice;u.rate=rateVal();speechSynthesis.speak(u)};
 if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,60)}else go()}catch{}};
const fmtDue=ms=>{const d=ms-Date.now();if(d<=0)return'due now';if(d<36e5)return'in '+Math.ceil(d/MIN)+' min';
 if(d<DAY)return'in '+Math.ceil(d/36e5)+' h';const n=Math.ceil(d/DAY);if(n<90)return'in '+n+' d';if(n<700)return'in '+Math.round(n/30)+' mo';return'in '+Math.round(n/365)+' y'};
const catOf=c=>{const k=c.cat||'General';return k==='عمومی'?'General':k};
const cats=()=>[...new Set(cards.map(catOf))].sort((a,b)=>a.localeCompare(b));
const isDue=c=>c.status==='ready'&&c.due<=Date.now();
const FAVN='Favorites';
const inCat=(c,n)=>n===FAVN?!!c.fav:catOf(c)===n;
const allCats=()=>{const l=cats();return cards.some(c=>c.fav)?[FAVN,...l]:l};
/* pinned categories + custom order (per device, like Sort / Front-back layout) */
const jl=k=>{try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[]}catch{return[]}};
const CPIN=()=>jl('catPins'),CORD=()=>jl('catOrder');
const isPinned=n=>CPIN().includes(n);
function orderedCats(){const l=allCats(),o=CORD(),p=CPIN();
 const known=o.filter(n=>l.includes(n)),rest=l.filter(n=>!o.includes(n));
 const base=[...rest.filter(n=>n===FAVN),...known,...rest.filter(n=>n!==FAVN)];
 return[...base.filter(n=>p.includes(n)),...base.filter(n=>!p.includes(n))]}
const catsOrd=()=>orderedCats().filter(n=>n!==FAVN);
const lsave=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
function togglePin(n){if(!n)return;let p=CPIN();const was=p.includes(n);p=was?p.filter(x=>x!==n):[...p,n];lsave('catPins',p);render();toast(was?'Unpinned':'Pinned to the top',1800)}
function moveCat(n,d){const l=orderedCats(),pin=CPIN(),pn=pin.includes(n);
 const g=l.filter(x=>pin.includes(x)===pn),other=l.filter(x=>pin.includes(x)!==pn),i=g.indexOf(n),j=i+d;
 if(i<0||j<0||j>=g.length)return;[g[i],g[j]]=[g[j],g[i]];
 lsave('catOrder',pn?[...g,...other]:[...other,...g]);render()}

/* drag-to-reorder (mouse + touch): grab an element with [data-grip] */
function dragSort(box,itemSel,onDrop){
 box.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-grip]');if(!h||(e.pointerType==='mouse'&&e.button!==0))return;
  const it=h.closest(itemSel);if(!it||!box.contains(it))return;

/* ---------- AI generation (queued, offline-safe) ---------- */
const KEY=()=>localStorage.getItem('appKey')||'';
var genBusy=false,genStop=false,genCtl=null;
function stopGen(){if(!genBusy)return;genStop=true;try{genCtl&&genCtl.abort()}catch{}toast('Stopping…',1500)}
document.addEventListener('click',e=>{if(e.target.closest('[data-stopgen]'))stopGen()});
async function gen(list){
 list=(list||[]).filter(c=>c&&c.status!=='ready');if(!list.length)return;
 if(genBusy)return toast('Already generating…');
 if(!KEY())return toast('Enter the access key in Settings first');
 if(!navigator.onLine)return toast('You are offline');
 genBusy=true;genStop=false;genCtl=new AbortController();const total=list.length;let left=total,ok=0,stop='';render();
 try{
  for(let i=0;i<list.length&&!stop&&!genStop;i+=3){
   const chunk=list.slice(i,i+3);
   $('#queue').innerHTML=`Generating… ${left} left <button class="btn sm" data-stopgen type="button">Stop</button>`;toast(`Generating… ${left} left`,60000);
   await Promise.all(chunk.map(async c=>{
    try{const r=await fetch('/api/generate',{method:'POST',signal:genCtl.signal,headers:{'content-type':'application/json','x-app-key':KEY()},body:JSON.stringify({word:c.word})});
     if(r.status===401){stop='Wrong access key';return}
     const j=await r.json();if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
     c.data=j.data;c.status='ready';c.due=Date.now();delete c.err;ok++}
    catch(e){if(genStop||e.name==='AbortError')return;const m=String(e.message||e);if(m.includes('4006'))stop='AI quota used up for today. Try again later.';else{c.status='error';c.err=m.slice(0,300)}}
    left--;
    const cur=await new Promise(r=>{const q=store('readonly').get(c.id);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
    if(cur&&cur.deleted)return;

   await refresh()}
 }finally{const wasStop=genStop;genBusy=false;genStop=false;genCtl=null;$('#queue').textContent='';render();
  toast(wasStop?`Generation stopped${ok?` (${ok} generated)`:''}`:stop?`${stop}${ok?` (${ok} generated)`:''}`:`Generated ${ok} of ${total}`,4000)}
}

  for(let i=0;i<list.length&&!stop&&!genStop;i+=3){
   const chunk=list.slice(i,i+3);
   $('#queue').innerHTML=`Regenerating… ${left} left <button class="btn sm" data-stopgen type="button">Stop</button>`;toast(`Regenerating… ${left} left`,60000);
   await Promise.all(chunk.map(async c=>{
    try{const r=await fetch('/api/generate',{method:'POST',signal:genCtl.signal,headers:{'content-type':'application/json','x-app-key':KEY()},body:JSON.stringify({word:c.word})});
     if(r.status===401){stop='Wrong access key';return}
     const j=await r.json();if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
     const cur=await new Promise(q=>{const g=store('readonly').get(c.id);g.onsuccess=()=>q(g.result);g.onerror=()=>q(null)});
     if(!cur||cur.deleted)return;
     cur.data=j.data;cur.status='ready';delete cur.err;await save(cur);ok++}
    catch(e){if(genStop||e.name==='AbortError')return;const m=String(e.message||e);if(m.includes('4006'))stop='AI quota used up for today. Try again later.';else fail++}
    left--}));
   await refresh()}
 }finally{const wasStop=genStop;genBusy=false;genStop=false;genCtl=null;$('#queue').textContent='';await refresh();
  toast(wasStop?`Stopped${ok?` (${ok} regenerated)`:''}`:stop?`${stop}${ok?` (${ok} regenerated)`:''}`:`Regenerated ${ok} of ${total}${fail?` · ${fail} failed, kept as before`:''}`,5000)}
}

/* ---------- sync ---------- */
let syncT,syncing=false,syncAgain=false,syncFail=0;
// request size adapts per direction: grows after every success, halves after a dropped connection
let SZ={pull:150000,push:60000};try{const o=JSON.parse(localStorage.syncSZ||'null');if(o&&o.pull&&o.push)SZ=o}catch{}
const szAdj=(k,up)=>{SZ[k]=Math.round(Math.min(500000,Math.max(6000,up?SZ[k]*1.4:SZ[k]/2)));try{localStorage.syncSZ=JSON.stringify(SZ)}catch{}};
const scheduleSync=()=>{clearTimeout(syncT);syncT=setTimeout(sync,2500)};
function syncState(t,on){$('#syncState').textContent=t;$('#dot').className='dot'+(on?' on':'')}
const jget=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}};
const lset=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch{}};
const KB=n=>Math.round(n/1024)+' KB';
/* ---------- card settings sync (layout, pins, order, sort, review parameters) between devices ---------- */
const SET_WHOLE=['catPins','catOrder','dr','steps'],SET_MAPS=['catLayout','catSort'];
function setSnapshot(){const o={};
 SET_WHOLE.forEach(k=>{const v=localStorage.getItem(k);if(v!=null&&v!=='')o[k]=v});
 SET_MAPS.forEach(k=>{try{const m=JSON.parse(localStorage.getItem(k)||'{}');Object.keys(m).forEach(n=>{o[k+':'+n]=JSON.stringify(m[n])})}catch{}});
 return o}
function setClearLocal(){[...SET_WHOLE,...SET_MAPS,'setBase'].forEach(k=>{try{localStorage.removeItem(k)}catch{}})}
let setBusy=false;
async function syncSettings(pull){
 if(setBusy||!KEY()||!navigator.onLine)return;
 const snap=setSnapshot(),base=jget('setBase')||{},now=Date.now(),ch=[];
 new Set([...Object.keys(snap),...Object.keys(base)]).forEach(k=>{const cur=snap[k]??null,b=base[k]?base[k].v:null;if(cur!==b)ch.push({k,v:cur,t:now})});
 if(!ch.length&&!pull)return;
 setBusy=true;
 try{const j=await apiJ('/api/settings',null,{method:'POST',body:JSON.stringify({items:ch})});
  const now2=setSnapshot(),nb={...base},maps={};let changed=false;
  SET_MAPS.forEach(k=>{try{maps[k]=JSON.parse(localStorage.getItem(k)||'{}')}catch{maps[k]={}}});
  const seen=new Set();
  for(const r of j.items||[]){seen.add(r.k);
   const cur=now2[r.k]??null,was=snap[r.k]??null;
   if(cur!==was)continue; // changed on this device while the request was running: it is pushed in the next round
   if(r.v!==cur){changed=true;
    const i=r.k.indexOf(':');
    if(i<0){try{r.v==null?localStorage.removeItem(r.k):localStorage.setItem(r.k,r.v)}catch{}}
    else{const mk=r.k.slice(0,i),n=r.k.slice(i+1);if(maps[mk]){if(r.v==null)delete maps[mk][n];else{try{maps[mk][n]=JSON.parse(r.v)}catch{}}}}}
   nb[r.k]={v:r.v,t:r.t}}
  for(const k of Object.keys(nb))if(!seen.has(k)&&(now2[k]??null)===null)delete nb[k];
  if(changed)SET_MAPS.forEach(k=>{try{localStorage.setItem(k,JSON.stringify(maps[k]))}catch{}});
  lset('setBase',nb);
  if(changed){recs=null;render()}
 }catch(e){/* offline or server error: tried again with the next sync */}
 finally{setBusy=false}}
setInterval(()=>syncSettings(false),3000); // pushes a changed setting within seconds; pulling happens with every sync
async function sync(manual){
 if(syncing){syncAgain=true;return} // a change made during a running sync is pushed right after it
 if(!KEY()){if(manual===true)toast('Enter the access key in Settings');return}
 if(!navigator.onLine){syncState('Offline — will sync when back online');if(manual===true)toast('You are offline');return}
 syncSettings(true);
 syncing=true;$('#syncBtn').classList.add('busy');let retry=0,progress=false;
 try{const OV=600000,full=manual===true,since=full?0:Math.max(0,(+localStorage.since||0)-OV),lastPush=full?0:Math.max(0,(+localStorage.lastPush||0)-OV);
  // one request; big bodies are gzipped (much smaller upload, and the connection survives more often)
  const post=async(b,what,kind)=>{let body=JSON.stringify(b);const h={'content-type':'application/json','x-app-key':KEY()};
   try{if(body.length>3000&&typeof CompressionStream!=='undefined'){body=await new Response(new Blob([body]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();h['x-gz']='1'}}catch{}
   let r;try{r=await fetch('/api/sync',{method:'POST',headers:h,body})}catch(e){szAdj(kind,false);throw new TypeError(what+': '+e.message)}
   if(r.status===401){syncState('Wrong access key');return null}
   if(!r.ok){let t='';try{t=(await r.json()).error||''}catch{}throw new Error(what+': HTTP '+r.status+' '+t)}
   try{const j=await r.json();szAdj(kind,true);return j}catch(e){szAdj(kind,false);throw new TypeError(what+': response cut off')}};
  // 1) PULL first, in pages limited by size; every page is applied and its position saved at once
  const srv=new Map(),pu=jget('pullCur');
  if(!(jget('pushPlan'))){ // (if a push plan exists the pull of this round is already finished)
   let cursor={t:since,id:''},now=0,n=0,changed=false;
   if(pu&&pu.since===since){cursor={t:pu.t,id:pu.id};now=pu.now;n=pu.n||0}
   for(;;){const j=await post({cards:[],since:cursor.t,after:cursor.id,limit:500,maxBytes:SZ.pull},'pull page '+(n+1),'pull');if(!j)return;
    if(!now)now=j.now;
    j.cards.forEach(c=>srv.set(c.id,c.updatedAt||0));
    const cur=await getMany(j.cards.map(c=>c.id));
    const fresh=j.cards.filter((c,i)=>!cur[i]||c.updatedAt>cur[i].updatedAt);if(fresh.length){await putMany(fresh);changed=true}
    n++;progress=true;
    if(!j.more||!j.cursor)break;cursor=j.cursor;lset('pullCur',{since,t:cursor.t,id:cursor.id,now,n});
    syncState(`Syncing… received page ${n}`)}
   localStorage.since=now;lset('pullCur',null);if(changed)await refresh()}
  // 2) PUSH only what the server does not already have, oldest first, in size-limited gzipped chunks
  let plan=jget('pushPlan');
  if(!plan){const all=await getAll();
   const ids=all.filter(c=>c.updatedAt>lastPush&&!(srv.has(c.id)&&srv.get(c.id)>=c.updatedAt))
    .sort((x,y)=>x.updatedAt-y.updatedAt||(x.id<y.id?-1:1)).map(c=>c.id);
   plan={ids,pos:0,t0:Date.now()};if(ids.length)lset('pushPlan',plan)}
  while(plan.pos<plan.ids.length){
   const rows=(await getMany(plan.ids.slice(plan.pos,plan.pos+500))).filter(Boolean);
   // take as many cards as fit the size budget (at least one)
   let sz=0,take=0;const ids=plan.ids.slice(plan.pos,plan.pos+500);
   for(const c of rows){const l=JSON.stringify(c).length;if(take&&sz+l>SZ.push)break;sz+=l;take++}
   const part=rows.slice(0,take),used=part.length?ids.indexOf(part[part.length-1].id)+1:ids.length;
   if(part.length&&!await post({cards:part,since:9e15},`push ${plan.pos+used}/${plan.ids.length} (${KB(sz)})`,'push'))return;
   plan.pos+=used;lset('pushPlan',plan);progress=true;
   syncState(`Syncing… sent ${plan.pos}/${plan.ids.length}`)}
  localStorage.lastPush=plan.t0;lset('pushPlan',null);syncFail=0;
  if(manual===true)await refresh();syncState('Synced · '+new Date().toLocaleTimeString('en-US'),true);if(manual===true)toast('Synced')
 }catch(e){
  if(progress){syncFail=0;retry=400} // it moved forward before the connection dropped: just continue
  else{syncFail++;retry=Math.min(15000*syncFail,120000)}
  syncState('Sync interrupted: '+String(e.message||e).slice(0,110)+' — continuing')}
 finally{syncing=false;$('#syncBtn').classList.remove('busy');
  if(retry)setTimeout(sync,retry);else if(syncAgain){syncAgain=false;setTimeout(sync,500)}}}
/* ---------- accounts: admin creates users, each key = separate deck ---------- */
const apiJ=async(path,key,opt={})=>{const r=await fetch(path,{...opt,headers:{'content-type':'application/json','x-app-key':key||KEY()}});
 let j={};try{j=await r.json()}catch{}if(r.status===401)throw Object.assign(new Error('Wrong access key'),{code:401});
 if(!r.ok)throw new Error(j.error||'HTTP '+r.status);return j};
const showUsersRow=a=>{$('#usersRow').hidden=!a};
async function refreshMe(){try{const m=await apiJ('/api/me');localStorage.uid=m.uid;localStorage.uname=m.name;localStorage.isAdmin=m.admin?'1':'';showUsersRow(m.admin)}catch(e){if(e.code===401)showUsersRow(false)}}
showUsersRow(localStorage.isAdmin==='1');
const clearCards=()=>new Promise(r=>{const t=db.transaction('cards','readwrite');t.objectStore('cards').clear();t.oncomplete=()=>r()});
$('#saveKey').onclick=async()=>{const k=$('#key').value.trim();if(!k){toast('Enter the access key');return}
 let me;try{me=await apiJ('/api/me',k)}catch(e){toast(e.code===401?'Wrong access key':'Could not check the key: '+e.message,4000);return}
 const prev=localStorage.uid||(localStorage.appKey?'admin':'');
 if(prev&&prev!==me.uid&&(await getAll()).length){
  if(!confirm('This key belongs to a different account ('+me.name+'). The cards stored on this device will be removed from this device so they are not mixed into that account. Continue?'))return;
  await clearCards();localStorage.removeItem('lastBackup');setClearLocal()}
 localStorage.appKey=k;localStorage.uid=me.uid;localStorage.uname=me.name;localStorage.isAdmin=me.admin?'1':'';showUsersRow(me.admin);
 localStorage.since=0;localStorage.lastPush=0;lset('pushPlan',null);lset('pullCur',null);await refresh();sync(true)};
function showNewKey(name,key,verb){const b=$('#nuKey');b.hidden=false;
 b.innerHTML=`<b>${esc(name)}</b> — ${verb}. Send this key to the user now; it is shown only this once.<code>${esc(key)}</code><button class="btn sm" id="nuCopy">Copy key</button>`;
 $('#nuCopy').onclick=async()=>{try{await navigator.clipboard.writeText(key);toast('Copied')}catch{toast('Select the key and copy it')}}}
async function loadUsers(){const box=$('#uList');box.textContent='…';
 try{const {users}=await apiJ('/api/admin/users');
  box.innerHTML=users.length?users.map(u=>`<div class="urow"><div class="nm"><b>${esc(u.name)}</b><small>${u.cards} cards · ${new Date(u.created_at).toLocaleDateString('en-US')}</small></div><button class="btn sm" data-ur="${u.id}" data-n="${esc(u.name)}">New key</button><button class="btn sm" data-ud="${u.id}" data-n="${esc(u.name)}">Delete</button></div>`).join(''):'<p class="pron">No users yet.</p>'}

$('#nuAdd').onclick=async()=>{const name=$('#nuName').value.trim();if(!name){toast('Enter a name');return}
 try{const u=await apiJ('/api/admin/users',null,{method:'POST',body:JSON.stringify({name,key:$('#nuKeyIn').value.trim()})});$('#nuName').value='';$('#nuKeyIn').value='';showNewKey(u.name,u.key,'user created');loadUsers()}catch(e){toast(e.message,4000)}};
$('#uList').addEventListener('click',async e=>{const r=e.target.closest('[data-ur]'),d=e.target.closest('[data-ud]');
 try{if(r){const typed=prompt('New key for "'+r.dataset.n+'" (min 6 characters). Leave empty for a random key. The old key stops working immediately.','');
   if(typed===null)return;
   const u=await apiJ('/api/admin/reset',null,{method:'POST',body:JSON.stringify({id:r.dataset.ur,key:typed.trim()})});showNewKey(r.dataset.n,u.key,'new key')}
  else if(d){if(!confirm('Delete "'+d.dataset.n+'" and all of their cards? This cannot be undone.'))return;
   await apiJ('/api/admin/delete',null,{method:'POST',body:JSON.stringify({id:d.dataset.ud})});$('#nuKey').hidden=true;loadUsers()}}
 catch(err){toast(err.message,4000)}});
/* ---------- local backup / restore (per account, on this device) ---------- */
const BK_KEYS=['fsFront','fsBack','catPins','catOrder','catSort','catLayout','dr','steps','studyCat','lastCat'];
async function renderBackup(){const n=(await getAll()).filter(c=>!c.deleted).length,t=+localStorage.lastBackup;
 $('#bkInfo').textContent=`${n} cards on this device · last backup: ${t?new Date(t).toLocaleString('en-US'):'never'}`}
async function makeBackup(){
 const all=await getAll(),settings={};
 BK_KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!=null)settings[k]=v});
 const data={app:'flashcards-backup',version:1,createdAt:Date.now(),uid:localStorage.uid||'',name:localStorage.uname||'',settings,cards:all};
 const name=`flashcards-${fileSafe(data.name||'backup')}-${new Date().toISOString().slice(0,10)}.json`;
 const file=new File([JSON.stringify(data)],name,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});
   localStorage.lastBackup=Date.now();renderBackup();toast('Backup ready');return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);localStorage.lastBackup=Date.now();renderBackup();toast('Backup downloaded')}
async function restoreBackup(f){
 let d;try{d=JSON.parse(await f.text())}catch{return toast('This is not a valid backup file',4000)}
 if(!d||d.app!=='flashcards-backup'||!Array.isArray(d.cards))return toast('This is not a flashcards backup',4000);
 const valid=d.cards.filter(c=>c&&typeof c.id==='string'&&c.id);
 if(d.uid&&localStorage.uid&&d.uid!==localStorage.uid&&!confirm(`This backup belongs to another account (${d.name||d.uid}). Restore it into the current account anyway?`))return;
 if(!confirm(`Restore ${valid.filter(c=>!c.deleted).length} cards from the backup made on ${new Date(d.createdAt||0).toLocaleDateString('en-US')}? Cards that are newer on this device are kept.`))return;
 const cur=await getMany(valid.map(c=>c.id)),fresh=valid.filter((c,i)=>!cur[i]||(c.updatedAt||0)>(cur[i].updatedAt||0));
 await putMany(fresh);
 if(d.settings&&typeof d.settings==='object')BK_KEYS.forEach(k=>{if(typeof d.settings[k]==='string')try{localStorage.setItem(k,d.settings[k])}catch{}});
 localStorage.since=0;localStorage.lastPush=0;lset('pushPlan',null);lset('pullCur',null); // let the next sync upload whatever the server lacks
 await refresh();renderBackup();toast(`Restored ${fresh.length} cards`);if(KEY())sync(true)}
$('#bkSave').onclick=makeBackup;
$('#bkFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)restoreBackup(f)};
$('#syncNow').onclick=()=>sync(true);
addEventListener('online',()=>{sync()});
addEventListener('focus',()=>{sync()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
setInterval(()=>{if(!document.hidden&&KEY())sync()},60000); // desktop tabs stay open: pull other devices' changes regularly

/* ---------- theme / speed / tabs / boot ---------- */
const FS=k=>Math.min(200,Math.max(50,parseInt(localStorage[k])||100));
function applySizes(){const r=document.documentElement.style;r.setProperty('--ff',FS('fsFront')/100);r.setProperty('--fb',FS('fsBack')/100);
 const f=$('#fsF'),b=$('#fsB');if(f){f.value=FS('fsFront');$('#fsFv').textContent=FS('fsFront')+'%'}if(b){b.value=FS('fsBack');$('#fsBv').textContent=FS('fsBack')+'%'}}
applySizes();
$('#fsF').oninput=e=>{try{localStorage.fsFront=e.target.value}catch{}applySizes()};
$('#fsB').oninput=e=>{try{localStorage.fsBack=e.target.value}catch{}applySizes()};

 document.querySelector('meta[name=theme-color]').content=t==='light'?'#f2f2f7':'#000000';
 document.querySelectorAll('[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===t))}

setTheme(localStorage.theme||'dark');

$('#rate').oninput=e=>{localStorage.rate=e.target.value;$('#rateVal').textContent=(+e.target.value).toFixed(2)+'×'};

function renderIntervals(){
 $('#ivBox').innerHTML=`<div class="iv"><input type="number" min="70" max="99" step="1" inputmode="numeric" id="drIn" value="${Math.round(DR()*100)}" aria-label="Desired retention" style="max-width:110px"><span>%</span></div>
 <p class="pron" style="font-size:13px;margin-top:10px">The chance you want to still remember a card when it comes back (default 90%). Higher = more reviews. Intervals are calculated per card from its Stability and Difficulty.<br>Engine: ${fsLib()?'ts-fsrs':'built-in FSRS-5 (ts-fsrs could not be loaded)'}</p>
 <div class="row" style="margin-top:12px"><button class="btn sm" id="ivReset">Reset to 90%</button></div>`}
$('#ivBox').addEventListener('change',e=>{if(e.target.id!=='drIn')return;const v=fsClamp(Math.round(+e.target.value||90),70,99);localStorage.dr=v/100;toast('Desired retention '+v+'%');recs=null;renderIntervals();renderStudy()});
$('#ivBox').addEventListener('click',e=>{if(e.target.id==='ivReset'){delete localStorage.dr;recs=null;renderIntervals();renderStudy();toast('Back to 90%')}});
renderIntervals();

 document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===t));
 document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!==t);
 if(t==='cards')renderList();if(t==='study'){renderChips();renderStudy()}renderHeader();renderSelbar()}

 if($('#sheet').open)$('#sheet').close();if($('#dlg').open)$('#dlg').close();
 if(tab==='cards'){openCat=null;catEdit=false;$('#q').value='';selMode=false;sel.clear();renderList()}
 if(tab==='set'&&spOpen){openSp(null);return}
 if(tab==='study'&&studyOpen){closeDeck();return}
 toTop()}

/* swipe from the left edge to the right = Back (like iPhone) */
function goBack(){
 if($('#sheet').open){$('#sheet').close();return}
 if($('#dlg').open){$('#dlg').close();return}
 if($('#imp').open){$('#impNo')&&$('#impNo').click();return}
 if(catEdit){catEdit=false;renderList();return}
 if(selMode){exitSel();return}
 if(tab==='set'&&spOpen){openSp(null);return}
 if(tab==='cards'&&openCat){openCat=null;sel.clear();renderList();return}
 if(tab==='cards'&&$('#q').value){$('#q').value='';renderList();return}
 if(tab==='study'&&studyOpen){closeDeck();return}
 if(tab!=='study')go('study')}
let sx=0,sy=0,st=0,sOk=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();sOk=e.touches.length===1&&sx<=48},{passive:true});
document.addEventListener('touchend',e=>{if(!sOk)return;sOk=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);
 if(dx>70&&dx>dy*1.5&&Date.now()-st<900)goBack()},{passive:true});
load(LIB.fsrs).then(()=>{recs=null;renderIntervals();if(!$('#study').hidden)renderStudy()}).catch(()=>{});
(async()=>{await open();$('#key').value=KEY();await refresh();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
 if(!KEY()){go('set');openSp('sync')}else{sync();refreshMe()}
 setTimeout(()=>{const n=Date.now();if(cards.length>=5&&n-(+localStorage.lastBackup||0)>7*864e5&&n-(+localStorage.bkNag||0)>864e5){localStorage.bkNag=n;toast('Tip: make a backup in Settings › Backup',6000)}},4000);
 setInterval(()=>{if(!shown&&tab==='study'){renderChips();renderStudy()}},60000)})();
