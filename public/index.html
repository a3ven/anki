<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flashcards</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#000000">
<script>document.documentElement.dataset.theme=localStorage.theme||'dark'</script>
<style>
:root{--bg:#000;--surf:#1c1c1e;--surf2:#2c2c2e;--ink:#fff;--mute:#8e8e93;--line:#2f2f31;--acc:#0a84ff;--onacc:#fff;
--again:#ff453a;--hard:#ff9f0a;--good:#30d158;--easy:#0a84ff;color-scheme:dark}
:root[data-theme=light]{--bg:#f2f2f7;--surf:#fff;--surf2:#e9e9ee;--ink:#000;--mute:#6c6c70;--line:#d8d8dc;--acc:#007aff;
--again:#ff3b30;--hard:#e08600;--good:#1fa84a;--easy:#007aff;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Tahoma,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 120px}
section[hidden]{display:none}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px}
.rb{width:46px;height:46px;border-radius:50%;border:0;background:var(--surf);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:22px;flex:none}
h1{font-size:19px;font-weight:700;margin:0;text-align:center;flex:1;unicode-bidi:plaintext;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* floating tab bar */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 28px));
 display:flex;gap:2px;padding:6px;background:var(--surf);border:1px solid var(--line);border-radius:999px;z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--ink);padding:7px 0 6px;border-radius:999px;font:inherit;font-size:11px;font-weight:600;cursor:pointer}
nav button[aria-selected=true]{background:var(--bg);color:var(--acc)}

/* study */
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:0 4px 10px}
.card{background:var(--surf);border-radius:26px;padding:24px 20px;min-height:260px}
.word{font-size:36px;font-weight:700;text-align:center;margin:56px 0;word-break:break-word}
.en{direction:ltr;unicode-bidi:isolate}
.big{font-size:26px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pron{color:var(--mute);margin:2px 0 10px}
.pron .en{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.ex{border-inline-start:3px solid var(--acc);padding:2px 12px;margin:12px 0}
.ex .en{font-weight:600}
.ex .tr{color:var(--mute);font-size:15px}
.note{background:var(--surf2);border-radius:14px;padding:10px 14px;font-size:14px;margin-top:12px}
.tag{font-size:12px;color:var(--mute);background:var(--surf2);border-radius:999px;padding:1px 9px;font-weight:500}
.btn{font:inherit;border:0;background:var(--surf);color:var(--ink);border-radius:999px;padding:11px 18px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--acc);color:var(--onacc)}
.btn.sm{padding:6px 14px;font-size:14px;background:var(--surf)}
.btn.sm.on,.btn.on{background:var(--acc);color:var(--onacc)}
.danger{color:var(--again)}
.show{width:100%;margin-top:14px;height:54px;font-size:17px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate button{border:0;background:var(--surf);border-radius:20px;padding:12px 2px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.rate small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.rate .a{color:var(--again)}.rate .h{color:var(--hard)}.rate .g{color:var(--good)}.rate .e{color:var(--easy)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{font:inherit;font-size:14px;font-weight:600;border:0;background:var(--surf);color:var(--mute);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:var(--onacc)}

/* forms */
select,textarea,input[type=text],input[type=password],input[type=number]{width:100%;font:inherit;font-size:16px;background:var(--surf);color:var(--ink);border:0;border-radius:16px;padding:13px 16px}
textarea{min-height:150px;resize:vertical}
label,.fl{display:block;margin:18px 4px 6px;font-size:13px;font-weight:600;color:var(--mute)}
.search{display:flex;align-items:center;gap:10px;background:var(--surf);border-radius:999px;padding:0 18px;height:50px;margin-bottom:6px;color:var(--mute)}
.search input{border:0;background:none;padding:0;height:100%;font-size:17px;color:var(--ink);flex:1;outline:0;min-width:0}
input[type=file]{width:100%;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--acc)}

/* lists */
.it{display:flex;align-items:center;gap:14px;padding-inline-start:4px;cursor:pointer}
.ic{width:40px;height:52px;flex:none;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--mute);background:var(--surf);font-size:15px}
.ic.f{border:0;background:none;color:var(--acc)}
.ic.f svg{width:42px;height:42px;fill:currentColor;stroke:none}
.bd{flex:1;min-width:0;min-height:70px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.it:last-child .bd{border-bottom:0}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:500;font-size:17px;unicode-bidi:plaintext;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--mute);font-size:13px}
.chev{color:var(--mute);font-size:20px;padding:0 6px}
.x{border:0;background:none;color:var(--mute);font-size:19px;cursor:pointer;padding:6px}
.count{text-align:center;font-weight:700;font-size:15px;margin:22px 0}
.empty{text-align:center;color:var(--mute);padding:60px 10px}
.catline{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}

#msg{position:fixed;top:max(10px,env(safe-area-inset-top));inset-inline:14px;max-width:530px;margin:auto;background:var(--surf2);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;display:none;text-align:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-inline-end:6px}
.dot.on{background:var(--good)}
dialog{border:0;background:var(--surf);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.act{display:block;width:100%;text-align:start;border:0;background:var(--surf2);color:var(--ink);font:inherit;font-size:17px;padding:15px 18px;border-radius:16px;margin-top:8px;cursor:pointer}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);flex:none;display:grid;place-items:center}
.ck.on{background:var(--acc);border-color:var(--acc)}
.ck.on::after{content:"✓";color:var(--onacc);font-size:15px;font-weight:700}
#selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 28px));display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px;background:var(--surf2);border-radius:26px;z-index:6;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#selbar .n{width:100%;text-align:center;font-size:13px;color:var(--mute)}
#selbar .btn.sm{background:var(--surf)}
#selbar button:disabled{opacity:.4}
.iv{display:flex;align-items:center;gap:8px;margin-top:8px}
.iv span{width:64px;font-weight:700}
.iv input{width:96px}.iv select{flex:1}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="msg" role="status"></div>
<main>
<header>
  <button class="rb" id="back" aria-label="Back" style="visibility:hidden">‹</button>
  <h1 id="title">Study</h1>
  <button class="rb" id="more" aria-label="More">⋯</button>
</header>
<section id="study"><div id="chips" class="chips"></div><div id="sbody"></div></section>
<section id="add" hidden>
  <label for="catSel">Category</label>
  <select id="catSel"></select>
  <input type="text" id="newCat" placeholder="New category name" hidden style="margin-top:8px">
  <label for="words">Words (one per line, English or Persian)</label>
  <textarea id="words" placeholder="serendipity&#10;شانس&#10;give up"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn pri" id="addBtn">Create cards</button></div>
  <label for="file">Import from file (Excel, CSV, apkg)</label>
  <input type="file" id="file" accept=".xlsx,.xls,.csv,.apkg">
  <p class="pron" style="font-size:13px">Excel/CSV: first column of the first sheet. apkg: first field of each note. Only the words are imported. You will be asked whether to create a new category or use an existing one. Translation, pronunciation and examples are generated by AI.</p>
  <div id="queue" class="pron"></div>
</section>
<section id="cards" hidden>
  <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="q" placeholder="Search"></div>
  <div id="catHead"></div>
  <div id="list"></div>
</section>
<section id="set" hidden>
  <label for="key">Access key (the APP_KEY secret set on the Worker)</label>
  <input type="password" id="key" autocomplete="off">
  <div class="row" style="margin-top:12px">
    <button class="btn pri" id="saveKey">Save &amp; sync</button>
    <button class="btn" id="syncNow">Sync now</button>
  </div>
  <p class="pron" style="margin-top:12px"><span class="dot" id="dot"></span><span id="syncState">—</span></p>
  <label>Theme</label>
  <div class="row"><button class="btn sm" data-th="dark">Black</button><button class="btn sm" data-th="light">Light</button></div>
  <label>Review intervals (time until a card returns after each answer)</label>
  <div id="ivBox"></div>
  <label for="rate">Pronunciation speed</label>
  <input type="range" id="rate" min="0.4" max="1" step="0.05">
  <div class="row" style="margin-top:8px"><button class="btn sm" id="testSay">Test voice</button><span class="pron" id="rateVal"></span></div>
</section>
</main>
<nav role="tablist">
  <button role="tab" data-t="study" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="13" rx="3"/><path d="M7 4h11a3 3 0 0 1 3 3v9"/></svg>Study</button>
  <button role="tab" data-t="add" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</button>
  <button role="tab" data-t="cards" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Cards</button>
  <button role="tab" data-t="set" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Settings</button>
</nav>
<div id="selbar"></div>
<dialog id="imp"><div id="impBody"></div></dialog>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<dialog id="sheet"><div id="sheetBody"></div></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MIN=6e4,DAY=864e5;
const DEF={again:30*MIN,hard:DAY,good:3*DAY,easy:365*DAY};
const steps=()=>{try{return{...DEF,...JSON.parse(localStorage.steps||'{}')}}catch{return{...DEF}}};
const fmtIv=ms=>{const m=ms/MIN;if(m<60)return Math.round(m)+' min';if(m<1440){const h=Math.round(m/60);return h+' h'}
 const d=ms/DAY;if(d<60){const n=Math.round(d);return n+(n===1?' day':' days')}if(d<360)return Math.round(d/30)+' mo';
 const y=Math.round(d/365*10)/10;return y+(y===1?' year':' years')};
const NAME={again:'Again',hard:'Hard',good:'Good',easy:'Easy'};
const LIB={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
 zip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
 sql:'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js',
 sqlBase:'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'};
const FOLDER='<svg viewBox="0 0 24 24"><path d="M2 7a3 3 0 0 1 3-3h4l2 2h8a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3z"/></svg>';

/* ---------- storage ---------- */
let db,cards=[];
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('flash',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('cards',{keyPath:'id'});
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const store=m=>db.transaction('cards',m).objectStore('cards');
const getAll=()=>new Promise(r=>{const q=store('readonly').getAll();q.onsuccess=()=>r(q.result)});
const putMany=cs=>new Promise(r=>{const t=db.transaction('cards','readwrite'),s=t.objectStore('cards');cs.forEach(c=>s.put(c));t.oncomplete=()=>r()});
const save=async c=>{c.updatedAt=Date.now();await putMany([c]);scheduleSync()};
async function refresh(){cards=(await getAll()).filter(c=>!c.deleted);render()}

const toast=(t,ms=2500)=>{const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',ms)};
const rateVal=()=>+localStorage.rate||0.7;
const speak=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rateVal();speechSynthesis.cancel();speechSynthesis.speak(u)}catch{}};
const fmtDue=ms=>{const d=ms-Date.now();if(d<=0)return'due now';if(d<36e5)return'in '+Math.ceil(d/MIN)+' min';
 if(d<DAY)return'in '+Math.ceil(d/36e5)+' h';const n=Math.ceil(d/DAY);if(n<90)return'in '+n+' d';if(n<700)return'in '+Math.round(n/30)+' mo';return'in '+Math.round(n/365)+' y'};
const catOf=c=>{const k=c.cat||'General';return k==='عمومی'?'General':k};
const cats=()=>[...new Set(cards.map(catOf))].sort((a,b)=>a.localeCompare(b));
const isDue=c=>c.status==='ready'&&c.due<=Date.now();
async function resetCards(list){const now=Date.now();
 list.forEach(c=>{if(c.status==='ready'){c.due=now;c.interval=0;c.reps=0}c.updatedAt=now});
 await putMany(list);cur=null;shown=false;await refresh();scheduleSync()}

/* ---------- study ---------- */
let cur=null,shown=false,off=new Set(JSON.parse(localStorage.offCats||'[]'));
const dueList=()=>cards.filter(c=>isDue(c)&&!off.has(catOf(c))).sort((a,b)=>a.due-b.due);
function backHtml(c){const d=c.data||{};
 return `<div class="row"><span class="big en">${esc(d.en)}</span>
 <button class="btn sm" data-say="${esc(d.en)}" aria-label="Play pronunciation">🔊</button>${d.pos?`<span class="tag">${esc(d.pos)}</span>`:''}</div>
 <div class="pron"><span class="en">${esc(d.ipa)}</span> &nbsp; <span dir="auto">${esc(d.fa_pron)}</span></div>
 <div class="big" dir="auto" style="font-size:22px">${esc(d.fa)}</div>
 ${(d.examples||[]).map(e=>`<div class="ex"><div class="en">${esc(e.en)}</div><div class="tr" dir="auto">${esc(e.fa)}</div></div>`).join('')}
 ${d.note?`<div class="note" dir="auto">${esc(d.note)}</div>`:''}`}
function renderChips(){const l=cats();
 $('#chips').innerHTML=l.length>1?l.map(n=>{const k=cards.filter(c=>catOf(c)===n&&isDue(c)).length;
  return `<button class="chip" aria-pressed="${!off.has(n)}" data-cat="${esc(n)}">${esc(n)} · ${k}</button>`}).join(''):''}
$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;
 const n=b.dataset.cat;off.has(n)?off.delete(n):off.add(n);localStorage.offCats=JSON.stringify([...off]);cur=null;shown=false;renderChips();renderStudy()});
function renderStudy(){
 const el=$('#sbody'),sel=cards.filter(c=>!off.has(catOf(c))),list=dueList();
 if(!cards.length){el.innerHTML='<div class="empty">No cards yet.<br>Add some words in the Add tab.</div>';cur=null;return}
 if(!sel.length){el.innerHTML='<div class="empty">No category selected.</div>';cur=null;return}
 if(!list.length){const next=sel.filter(c=>c.status==='ready').sort((a,b)=>a.due-b.due)[0];
  const pend=sel.filter(c=>c.status!=='ready').length;
  el.innerHTML=`<div class="empty">You're all caught up 🎉<br>${next?'Next card: '+fmtDue(next.due):''}${pend?`<br>${pend} card${pend>1?'s':''} waiting to be generated`:''}</div>`;cur=null;return}
 if(!cur||!list.find(c=>c.id===cur.id))cur=list[0];
 const c=cur;
 el.innerHTML=`<div class="top"><span>${list.length} due</span><span>${sel.length} total</span></div>
 <div class="card">${shown?backHtml(c):`<div class="word" dir="auto">${esc(c.word)}</div>`}</div>
 ${shown?`<div class="rate">${['again','hard','good','easy'].map(k=>`<button class="${k[0]}" data-r="${k}">${NAME[k]}<small>${fmtIv(steps()[k])}</small></button>`).join('')}</div>`
 :'<button class="btn pri show" id="showBtn">Show answer</button>'}`}
async function rate(k){if(!cur||!shown)return;const c=cur,iv=steps()[k];c.due=Date.now()+iv;c.interval=iv;c.reps=(c.reps||0)+1;
 shown=false;cur=null;await save(c);await refresh()}
$('#sbody').addEventListener('click',e=>{
 const s=e.target.closest('[data-say]');if(s)return speak(s.dataset.say);
 const r=e.target.closest('[data-r]');if(r)return rate(r.dataset.r);
 if(e.target.id==='showBtn'){shown=true;renderStudy()}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;
 if($('#study').hidden||$('#dlg').open||$('#sheet').open)return;
 if(e.key===' '&&cur&&!shown){e.preventDefault();shown=true;renderStudy()}
 else if(shown&&'1234'.includes(e.key))rate(['again','hard','good','easy'][+e.key-1])});

/* ---------- cards tab: categories -> words ---------- */
let openCat=null,tab='study';
function renderHeader(){
 $('#title').textContent={study:'Study',add:'Add',cards:openCat||'Cards',set:'Settings'}[tab];
 $('#back').style.visibility=(tab==='cards'&&openCat)?'visible':'hidden'}
let selMode=false,sel=new Set();
function visible(){const q=$('#q').value.trim().toLowerCase();
 const ok=c=>!q||c.word.toLowerCase().includes(q)||(c.data?.fa||'').includes(q)||(c.data?.en||'').toLowerCase().includes(q);
 return cards.filter(c=>(!openCat||catOf(c)===openCat)&&ok(c)).sort((a,b)=>b.createdAt-a.createdAt)}
function exitSel(){selMode=false;sel.clear();renderList()}
function renderSelbar(){const b=$('#selbar');if(!selMode||tab!=='cards'){b.style.display='none';return}
 const n=sel.size,vis=visible(),nr=[...sel].filter(id=>{const c=cards.find(x=>x.id===id);return c&&c.status!=='ready'}).length;
 b.style.display='flex';
 b.innerHTML=`<div class="n">${n} selected</div><button class="btn sm" data-sa>${n&&n===vis.length?'Deselect all':'Select all'}</button>
 <button class="btn sm" data-sm ${n?'':'disabled'}>Move</button>${nr?'<button class="btn sm" data-sg>Generate</button>':''}
 <button class="btn sm danger" data-sd ${n?'':'disabled'}>Delete</button><button class="btn sm" data-sx>Done</button>`}
function renderList(){
 const q=$('#q').value.trim().toLowerCase();
 if(openCat&&!cards.some(c=>catOf(c)===openCat))openCat=null;
 [...sel].forEach(id=>{if(!cards.some(c=>c.id===id))sel.delete(id)});
 const flat=!!(openCat||q),head=$('#catHead'),list=$('#list');
 if(!flat){selMode=false;sel.clear()}
 let h='';
 if(openCat){const cs=cards.filter(c=>catOf(c)===openCat);
  h+=`<div class="pron" style="margin:8px 4px">${cs.length} card${cs.length===1?'':'s'} · ${cs.filter(isDue).length} due</div>`}
 if(flat){const nr=openCat?cards.filter(c=>catOf(c)===openCat&&c.status!=='ready').length:0;
  h+=`<div class="catline"><button class="btn sm ${selMode?'on':''}" data-selmode>${selMode?'Done':'Select'}</button>`
  +(openCat&&!selMode?`<button class="btn sm" data-renamecat>Rename</button><button class="btn sm" data-resetcat>Reset review</button>${nr?`<button class="btn sm" data-gencat>Generate (${nr})</button>`:''}<button class="btn sm danger" data-delcat>Delete all</button>`:'')+'</div>'}
 head.innerHTML=h;
 renderHeader();renderSelbar();
 if(!flat){const l=cats();
  list.innerHTML=l.length?l.map(n=>{const cs=cards.filter(c=>catOf(c)===n);
   return `<div class="it" data-open="${esc(n)}"><div class="ic f">${FOLDER}</div><div class="bd"><div class="tx"><b>${esc(n)}</b><small>${cs.length} card${cs.length===1?'':'s'} · ${cs.filter(isDue).length} due</small></div><span class="chev">›</span></div></div>`}).join('')
   +`<div class="count">${l.length} categor${l.length===1?'y':'ies'}</div>`
   :'<div class="empty">No categories yet.</div>';return}
 const l=visible();
 list.innerHTML=l.length?l.map(c=>`<div class="it" data-id="${esc(c.id)}">${selMode?`<div class="ck ${sel.has(c.id)?'on':''}"></div>`:''}<div class="ic">${esc([...c.word][0]||'?').toUpperCase()}</div>
  <div class="bd"><div class="tx"><b>${esc(c.word)}</b><small>${openCat?'':esc(catOf(c))+' · '}${c.status==='ready'?fmtDue(c.due):c.status==='error'?'error — not generated':'pending'}</small></div>
  ${selMode?'':`${c.status==='error'?`<button class="x" data-retry="${esc(c.id)}" title="Generate" aria-label="Generate">↻</button>`:''}
  ${c.status==='ready'?`<button class="x" data-reset="${esc(c.id)}" title="Reset review" aria-label="Reset review">⟲</button>`:''}
  <button class="x" data-del="${esc(c.id)}" aria-label="Delete">✕</button>`}</div></div>`).join('')
  +`<div class="count">${l.length} item${l.length===1?'':'s'}</div>`:'<div class="empty">Nothing found.</div>'}
$('#q').oninput=renderList;

async function renameCat(){const n=(prompt('Category name',openCat)||'').trim();if(!n||n===openCat)return;
 const t=cards.filter(c=>catOf(c)===openCat),now=Date.now();t.forEach(c=>{c.cat=n;c.updatedAt=now});await putMany(t);
 if(off.has(openCat)){off.delete(openCat);off.add(n);localStorage.offCats=JSON.stringify([...off])}
 openCat=n;await refresh();scheduleSync();toast('Category renamed')}
async function resetCat(){const t=cards.filter(c=>catOf(c)===openCat&&c.status==='ready');
 if(!t.length||!confirm(`Reset review for ${t.length} card${t.length>1?'s':''} in "${openCat}"?`))return;
 await resetCards(t);toast('Review reset')}
async function deleteCat(){const n=openCat,t=cards.filter(c=>catOf(c)===n);
 if(!confirm(`Delete all ${t.length} cards in "${n}"?`))return;
 const now=Date.now();t.forEach(c=>{c.deleted=true;c.updatedAt=now});await putMany(t);off.delete(n);openCat=null;
 await refresh();scheduleSync();toast('Category deleted')}
async function requestGen(list){list=list.filter(c=>c&&c.status!=='ready');if(!list.length)return;
 if(!KEY())return toast('Enter the access key in Settings first');
 list.forEach(c=>{c.status='pending';c.updatedAt=Date.now()});await putMany(list);await refresh();scheduleSync();
 if(!navigator.onLine)toast('Offline — will generate when you are back online');
 else{toast(`Generating ${list.length} card${list.length>1?'s':''}…`);gen()}}
$('#catHead').addEventListener('click',e=>{
 if(e.target.closest('[data-selmode]')){selMode=!selMode;sel.clear();renderList()}
 else if(e.target.closest('[data-gencat]'))requestGen(cards.filter(c=>catOf(c)===openCat));
 else if(e.target.closest('[data-renamecat]'))renameCat();
 else if(e.target.closest('[data-resetcat]'))resetCat();
 else if(e.target.closest('[data-delcat]'))deleteCat()});
$('#list').addEventListener('click',async e=>{
 const g=k=>{const b=e.target.closest(`[data-${k}]`);return b&&cards.find(x=>x.id===b.dataset[k])};
 let c;
 if(c=g('del')){c.deleted=true;await save(c);await refresh();return}
 if(c=g('retry')){c.status='pending';await save(c);await refresh();gen();return}
 if(c=g('reset')){await resetCards([c]);toast('Review reset');return}
 const o=e.target.closest('[data-open]');if(o){openCat=o.dataset.open;$('#q').value='';renderList();return}
 const it=e.target.closest('[data-id]');if(!it)return;
 if(selMode){const id=it.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);renderList()}else openDetail(it.dataset.id)});
$('#selbar').addEventListener('click',async e=>{const t=e.target.closest('button');if(!t||t.disabled)return;
 const chosen=()=>cards.filter(c=>sel.has(c.id));
 if('sa' in t.dataset){const v=visible();if(sel.size===v.length)sel.clear();else v.forEach(c=>sel.add(c.id));renderList()}
 else if('sx' in t.dataset)exitSel();
 else if('sg' in t.dataset){const l=chosen();selMode=false;sel.clear();await requestGen(l)}
 else if('sd' in t.dataset){const l=chosen();if(!confirm(`Delete ${l.length} card${l.length>1?'s':''}?`))return;
  const now=Date.now();l.forEach(c=>{c.deleted=true;c.updatedAt=now});await putMany(l);selMode=false;sel.clear();await refresh();scheduleSync();toast('Deleted')}
 else if('sm' in t.dataset){const l=chosen();
  const mv=async n=>{const now=Date.now();l.forEach(c=>{c.cat=n;c.updatedAt=now});await putMany(l);selMode=false;sel.clear();await refresh();scheduleSync();toast(`Moved ${l.length} to "${n}"`)};
  showSheet([...cats().map(n=>[n,()=>mv(n)]),['+ New category…',()=>{const n=(prompt('New category name')||'').trim();if(n)mv(n)}]],'Move to')}});

/* ---------- header actions ---------- */
$('#back').onclick=()=>{if(tab==='cards'&&openCat){openCat=null;selMode=false;sel.clear();renderList()}};
function showSheet(a,title){
 $('#sheetBody').innerHTML=(title?`<b class="big" style="display:block;margin-bottom:6px">${esc(title)}</b>`:'')+a.map((x,i)=>`<button class="act ${x[2]?'danger':''}" data-i="${i}">${esc(x[0])}</button>`).join('');
 $('#sheet').onclick=e=>{const b=e.target.closest('[data-i]');if(b){$('#sheet').close();a[+b.dataset.i][1]()}else if(e.target===$('#sheet'))$('#sheet').close()};
 $('#sheet').showModal()}
$('#more').onclick=()=>{const a=[];
 if(tab==='cards'&&openCat)a.push(['Rename category',renameCat],['Reset review',resetCat],['Delete all cards',deleteCat,1]);
 a.push(['Sync now',()=>sync(true)],['Switch theme',()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light')]);
 showSheet(a)};

/* ---------- card detail + edit ---------- */
function openDetail(id){const c=cards.find(x=>x.id===id);if(!c)return;
 const opts=cats().map(n=>`<option ${n===catOf(c)?'selected':''}>${esc(n)}</option>`).join('')+'<option value="__new">+ New category…</option>';
 $('#dlgBody').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><b class="big" dir="auto">${esc(c.word)}</b><button class="x" data-close aria-label="Close">✕</button></div>`
  +(c.status==='ready'?backHtml(c):`<p class="pron">${c.status==='error'?'Card generation failed. You can fill it in manually with Edit.':'Not generated yet.'}</p>`)
  +`<label for="mv">Category</label><select id="mv" data-id="${esc(c.id)}">${opts}</select>`
  +(c.status==='ready'?`<p class="pron" style="margin-top:12px">Next review: ${fmtDue(c.due)}</p>`:'')
  +`<div class="row" style="margin-top:14px">${c.status!=='ready'?`<button class="btn pri" data-gen="${esc(c.id)}">Generate</button>`:''}<button class="btn ${c.status==='ready'?'pri':''}" data-edit="${esc(c.id)}">Edit</button>${c.status==='ready'?`<button class="btn" data-resetone="${esc(c.id)}">Reset review</button>`:''}<button class="btn danger" data-delone="${esc(c.id)}">Delete</button></div>`;
 if(!$('#dlg').open)$('#dlg').showModal()}
function openEdit(id){const c=cards.find(x=>x.id===id);if(!c)return;const d=c.data||{};
 const ex=[...(d.examples||[]),{},{},{}].slice(0,3);
 const f=(k,l,v,a)=>`<label class="fl" for="e_${k}">${l}</label><input type="text" id="e_${k}" value="${esc(v)}"${a?' dir="auto"':''}>`;
 $('#dlgBody').innerHTML=`<div class="row" style="justify-content:space-between"><b class="big">Edit card</b><button class="x" data-close aria-label="Close">✕</button></div>`
  +f('word','Front (word)',c.word,1)+f('en','English',d.en||'')+f('fa','Persian meaning',d.fa||'',1)+f('ipa','IPA',d.ipa||'')
  +f('fp','Pronunciation (Persian letters)',d.fa_pron||'',1)+f('pos','Part of speech',d.pos||'')
  +ex.map((e,i)=>f('xe'+i,`Example ${i+1} (English)`,e.en||'')+f('xf'+i,`Example ${i+1} (Persian)`,e.fa||'',1)).join('')
  +f('note','Note',d.note||'',1)
  +`<div class="row" style="margin-top:20px"><button class="btn pri" data-saveedit="${esc(id)}">Save</button><button class="btn" data-cancel="${esc(id)}">Cancel</button></div>`}
async function saveEdit(id){const c=cards.find(x=>x.id===id),v=k=>$('#e_'+k).value.trim();
 const w=v('word');if(!w)return toast('The front can\'t be empty');
 const d={en:v('en'),fa:v('fa'),ipa:v('ipa'),fa_pron:v('fp'),pos:v('pos'),note:v('note'),
  examples:[0,1,2].map(i=>({en:v('xe'+i),fa:v('xf'+i)})).filter(e=>e.en||e.fa)};
 c.word=w;c.data=d;c.edited=true;if(c.status!=='ready'&&d.en&&d.fa){c.status='ready';c.due=Date.now()}
 await save(c);await refresh();openDetail(id);toast('Saved')}
$('#dlg').addEventListener('click',async e=>{
 const t=e.target,at=k=>{const b=t.closest(`[data-${k}]`);return b&&b.dataset[k]};let v;
 if(t.closest('[data-say]'))return speak(t.closest('[data-say]').dataset.say);
 if(v=at('gen')){$('#dlg').close();await requestGen([cards.find(x=>x.id===v)]);return}
 if(v=at('edit'))return openEdit(v);
 if(v=at('cancel'))return openDetail(v);
 if(v=at('saveedit'))return saveEdit(v);
 if(v=at('resetone')){await resetCards([cards.find(x=>x.id===v)]);$('#dlg').close();toast('Review reset');return}
 if(v=at('delone')){const c=cards.find(x=>x.id===v);c.deleted=true;await save(c);$('#dlg').close();await refresh();return}
 if(t.closest('[data-close]')||t===$('#dlg'))$('#dlg').close()});
$('#dlg').addEventListener('change',async e=>{if(e.target.id!=='mv')return;
 const c=cards.find(x=>x.id===e.target.dataset.id);let n=e.target.value;
 if(n==='__new'){n=(prompt('New category name')||'').trim();if(!n){openDetail(c.id);return}}
 c.cat=n;await save(c);await refresh();openDetail(c.id);toast('Moved to "'+n+'"')});

/* ---------- add / import ---------- */
async function addWords(ws,cat){
 cat=cat||'General';
 const have=new Set((await getAll()).filter(c=>!c.deleted).map(c=>c.id));let n=0;const now=Date.now(),out=[];
 for(let w of ws){w=String(w).replace(/\s+/g,' ').trim();if(!w||w.length>60)continue;
  const id=w.toLowerCase();if(have.has(id))continue;have.add(id);
  out.push({id,word:w,cat,status:'pending',due:now,interval:0,reps:0,createdAt:now,updatedAt:now});n++}
 await putMany(out);localStorage.lastCat=cat;await refresh();$('#catSel').value=cat;$('#newCat').hidden=true;$('#newCat').value='';
 toast(`${n} new card${n===1?'':'s'} added to "${cat}"`);gen();scheduleSync()}
function fillCatSelect(){const sel=$('#catSel'),v=sel.value||localStorage.lastCat||'General';
 const l=[...new Set(['General',...cats()])];
 sel.innerHTML=l.map(c=>`<option>${esc(c)}</option>`).join('')+'<option value="__new">+ New category…</option>';
 sel.value=(v==='__new'||l.includes(v))?v:l[0];$('#newCat').hidden=sel.value!=='__new'}
$('#catSel').onchange=()=>{$('#newCat').hidden=$('#catSel').value!=='__new';if(!$('#newCat').hidden)$('#newCat').focus()};
function pickedCat(){const sel=$('#catSel');return sel.value==='__new'?($('#newCat').value.trim()||'General'):sel.value}
$('#addBtn').onclick=()=>{const v=$('#words').value.split('\n');$('#words').value='';addWords(v,pickedCat())};
const load=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();
 const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load the import library (are you offline?)'));document.head.appendChild(s)});
function askCat(n,def){return new Promise(res=>{const d=$('#imp');
 $('#impBody').innerHTML=`<b class="big">Import ${n} word${n===1?'':'s'}</b>
 <label for="impSel">Add to category</label>
 <select id="impSel"><option value="__new">+ New category</option>${cats().map(c=>`<option>${esc(c)}</option>`).join('')}</select>
 <input type="text" id="impName" value="${esc(def)}" placeholder="Category name" style="margin-top:8px">
 <div class="row" style="margin-top:18px"><button class="btn pri" id="impOk">Import</button><button class="btn" id="impNo">Cancel</button></div>`;
 $('#impSel').onchange=()=>{$('#impName').hidden=$('#impSel').value!=='__new'};
 const done=v=>{d.onclose=null;d.close();res(v)};
 $('#impOk').onclick=()=>done($('#impSel').value==='__new'?($('#impName').value.trim()||'General'):$('#impSel').value);
 $('#impNo').onclick=()=>done(null);
 d.onclose=()=>res(null);d.showModal()})}
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{toast('Reading file…',8000);const ext=f.name.split('.').pop().toLowerCase();let ws=[];
  if(['xlsx','xls','csv'].includes(ext)){await load(LIB.xlsx);
   const wb=XLSX.read(await f.arrayBuffer());
   ws=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}).map(r=>r[0]).filter(v=>v!=null&&v!=='').map(String);
   if(/^(word|words|front|کلمه|واژه)$/i.test((ws[0]||'').trim()))ws.shift()}
  else if(ext==='apkg'){await load(LIB.zip);await load(LIB.sql);
   const z=await JSZip.loadAsync(f);const ent=z.file('collection.anki21')||z.file('collection.anki2');
   if(!ent||(z.file('collection.anki21b')&&!z.file('collection.anki21')))
    throw new Error('This apkg uses the new Anki format. When exporting, enable "Support older Anki versions".');
   const SQL=await initSqlJs({locateFile:n=>LIB.sqlBase+n});
   const d=new SQL.Database(await ent.async('uint8array'));
   ws=((d.exec('select flds from notes')[0]||{}).values||[]).map(v=>String(v[0]).split('\x1f')[0].replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').trim());d.close()}
  else throw new Error('Unsupported file type');
  if(!ws.length)throw new Error('No words found in the file');
  $('#msg').style.display='none';
  const cat=await askCat(ws.length,f.name.replace(/\.[^.]+$/,''));if(!cat)return;
  await addWords(ws,cat)}catch(err){toast(err.message,6000)}};

/* ---------- AI generation (queued, offline-safe) ---------- */
const KEY=()=>localStorage.getItem('appKey')||'';
let genBusy=false;
async function gen(){
 if(genBusy||!navigator.onLine||!KEY())return;genBusy=true;
 try{
  while(true){
   const todo=cards.filter(c=>c.status==='pending').slice(0,3);if(!todo.length)break;
   $('#queue').textContent=`Generating… ${cards.filter(c=>c.status==='pending').length} left`;
   let stop=false;
   await Promise.all(todo.map(async c=>{
    try{const r=await fetch('/api/generate',{method:'POST',headers:{'content-type':'application/json','x-app-key':KEY()},body:JSON.stringify({word:c.word})});
     if(r.status===401){stop=true;toast('Wrong access key');return}
     const j=await r.json();if(!r.ok)throw 0;c.data=j.data;c.status='ready';c.due=Date.now()}
    catch{if(!stop){c.status='error'}}
    await save(c)}));
   await refresh();if(stop||!navigator.onLine)break}
 }finally{genBusy=false;$('#queue').textContent=cards.some(c=>c.status==='pending')&&!KEY()?'Enter the access key in Settings to generate cards.':''}
}

/* ---------- sync ---------- */
let syncT,syncing=false;
const scheduleSync=()=>{clearTimeout(syncT);syncT=setTimeout(sync,2500)};
function syncState(t,on){$('#syncState').textContent=t;$('#dot').className='dot'+(on?' on':'')}
async function sync(manual){
 if(syncing)return;if(!KEY()){if(manual===true)toast('Enter the access key in Settings');return}
 if(!navigator.onLine){syncState('Offline — will sync when back online');if(manual===true)toast('You are offline');return}
 syncing=true;
 try{const since=+localStorage.since||0,lastPush=+localStorage.lastPush||0,t0=Date.now();
  const all=await getAll();
  const r=await fetch('/api/sync',{method:'POST',headers:{'content-type':'application/json','x-app-key':KEY()},
   body:JSON.stringify({cards:all.filter(c=>c.updatedAt>lastPush),since})});
  if(r.status===401){syncState('Wrong access key');return}
  const j=await r.json();const local=new Map(all.map(c=>[c.id,c]));
  await putMany(j.cards.filter(c=>!local.has(c.id)||c.updatedAt>local.get(c.id).updatedAt));
  localStorage.since=j.now;localStorage.lastPush=t0;
  await refresh();syncState('Synced · '+new Date().toLocaleTimeString('en-US'),true);if(manual===true)toast('Synced');gen()
 }catch{syncState('Sync failed')}finally{syncing=false}}
$('#saveKey').onclick=()=>{localStorage.appKey=$('#key').value.trim();localStorage.since=0;localStorage.lastPush=0;sync(true);gen()};
$('#syncNow').onclick=()=>sync(true);
addEventListener('online',()=>{sync();gen()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});

/* ---------- theme / speed / tabs / boot ---------- */
function setTheme(t){localStorage.theme=t;document.documentElement.dataset.theme=t;
 document.querySelector('meta[name=theme-color]').content=t==='light'?'#f2f2f7':'#000000';
 document.querySelectorAll('[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===t))}
document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>setTheme(b.dataset.th));
setTheme(localStorage.theme||'dark');
$('#rate').value=rateVal();$('#rateVal').textContent=rateVal().toFixed(2)+'×';
$('#rate').oninput=e=>{localStorage.rate=e.target.value;$('#rateVal').textContent=(+e.target.value).toFixed(2)+'×'};
$('#testSay').onclick=()=>speak('The quick brown fox jumps over the lazy dog');
function renderIntervals(){const s=steps();
 $('#ivBox').innerHTML=['again','hard','good','easy'].map(k=>{const ms=s[k];let u=MIN;if(ms%DAY===0)u=DAY;else if(ms%36e5===0)u=36e5;
  return `<div class="iv"><span style="color:var(--${k})">${NAME[k]}</span><input type="number" min="0.1" step="any" inputmode="decimal" data-ivk="${k}" value="${ms/u}" aria-label="${NAME[k]} interval">
  <select data-ivu="${k}" aria-label="${NAME[k]} unit"><option value="${MIN}" ${u===MIN?'selected':''}>minutes</option><option value="${36e5}" ${u===36e5?'selected':''}>hours</option><option value="${DAY}" ${u===DAY?'selected':''}>days</option></select></div>`}).join('')
  +'<div class="row" style="margin-top:12px"><button class="btn sm" id="ivReset">Reset to defaults</button></div>'}
$('#ivBox').addEventListener('change',()=>{const out={};
 for(const k of ['again','hard','good','easy']){const n=Math.max(.1,+$(`[data-ivk=${k}]`).value||1);out[k]=Math.round(n*+$(`[data-ivu=${k}]`).value)}
 localStorage.steps=JSON.stringify(out);toast('Intervals saved');renderIntervals();renderStudy()});
$('#ivBox').addEventListener('click',e=>{if(e.target.id==='ivReset'){delete localStorage.steps;renderIntervals();renderStudy();toast('Defaults restored')}});
renderIntervals();
function render(){renderChips();renderStudy();fillCatSelect();if(!$('#cards').hidden)renderList()}
function go(t){tab=t;selMode=false;sel.clear();
 document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===t));
 document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!==t);
 if(t==='cards')renderList();if(t==='study'){renderChips();renderStudy()}renderHeader();renderSelbar()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
(async()=>{await open();$('#key').value=KEY();await refresh();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
 if(!KEY())go('set');else{sync();gen()}
 setInterval(()=>{if(!shown&&tab==='study'){renderChips();renderStudy()}},60000)})();
</script>
